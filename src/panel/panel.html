<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Lit Flow — Reactivity DevTools</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div
      class="panel-shell"
      id="panel-shell"
      data-empty="true"
      data-active-tab="inspector"
    >
      <header class="toolbar" role="toolbar" aria-label="Lit Flow controls">
        <div class="toolbar-row toolbar-primary">
          <div class="toolbar-brand">
            <svg
              class="brand-mark"
              width="18"
              height="18"
              viewBox="0 0 18 18"
              aria-hidden="true"
            >
              <line
                x1="4"
                y1="5.5"
                x2="9.5"
                y2="9"
                stroke="currentColor"
                stroke-width="1.35"
                stroke-opacity="0.45"
              />
              <line
                x1="4"
                y1="12.5"
                x2="9.5"
                y2="9"
                stroke="currentColor"
                stroke-width="1.35"
                stroke-opacity="0.45"
              />
              <line
                x1="9.5"
                y1="9"
                x2="14.5"
                y2="5.5"
                stroke="currentColor"
                stroke-width="1.35"
                stroke-opacity="0.45"
              />
              <line
                x1="9.5"
                y1="9"
                x2="14.5"
                y2="12.5"
                stroke="currentColor"
                stroke-width="1.35"
                stroke-opacity="0.45"
              />
              <circle cx="4" cy="5.5" r="2.2" fill="var(--kind-model)" />
              <circle cx="4" cy="12.5" r="2.2" fill="var(--kind-context)" />
              <circle cx="9.5" cy="9" r="2.5" fill="var(--kind-element)" />
              <circle cx="14.5" cy="5.5" r="2.1" fill="var(--kind-computed)" />
              <circle cx="14.5" cy="12.5" r="2.1" fill="var(--kind-observer)" />
            </svg>
            <span class="brand-title">Lit Flow</span>
            <span
              class="status-pill"
              id="connection-status"
              data-testid="connection-status"
              data-state="connecting"
              role="status"
              aria-live="polite"
            >
              <span class="status-dot" aria-hidden="true"></span>
              <span class="status-label" id="connection-status-text"
                >Connecting…</span
              >
            </span>
          </div>

          <div class="search-wrap">
            <svg
              class="search-icon"
              width="13"
              height="13"
              viewBox="0 0 16 16"
              fill="none"
              aria-hidden="true"
            >
              <circle
                cx="7"
                cy="7"
                r="4.8"
                stroke="currentColor"
                stroke-width="1.6"
              />
              <path
                d="M10.7 10.7L14 14"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
            <input
              type="search"
              id="search-input"
              class="search-input"
              data-testid="search-input"
              placeholder="Filter by tag, prop, context, file…"
              aria-label="Filter graph nodes by tag, property, context, or file"
              autocomplete="off"
              spellcheck="false"
            />
          </div>

          <div class="toolbar-actions">
            <button
              type="button"
              class="tool-btn"
              id="pause-btn"
              data-testid="pause-btn"
              aria-pressed="false"
              title="Pause or resume reactivity capture"
            >
              <svg
                width="12"
                height="12"
                viewBox="0 0 12 12"
                fill="none"
                aria-hidden="true"
              >
                <rect
                  x="2"
                  y="2"
                  width="2.8"
                  height="8"
                  rx="0.8"
                  fill="currentColor"
                />
                <rect
                  x="7.2"
                  y="2"
                  width="2.8"
                  height="8"
                  rx="0.8"
                  fill="currentColor"
                />
              </svg>
              <span>Pause</span>
            </button>

            <button
              type="button"
              class="tool-btn"
              id="memo-hits-btn"
              data-testid="memo-hits-btn"
              aria-pressed="false"
              title="Capture memoize-one cache hits in trace stream"
            >
              Memo hits
            </button>

            <button
              type="button"
              class="tool-btn"
              id="events-btn"
              data-testid="events-btn"
              aria-pressed="true"
              title="Capture composed custom events"
            >
              Events
            </button>

            <span class="toolbar-sep" aria-hidden="true"></span>

            <button
              type="button"
              class="tool-btn"
              id="scan-dom-btn"
              data-testid="scan-dom-btn"
              title="Scan document and shadow roots for Lit elements"
            >
              Scan DOM
            </button>

            <button
              type="button"
              class="tool-btn"
              id="sync-elements-btn"
              data-testid="sync-elements-btn"
              title="Select the element currently inspected as $0 in Elements"
            >
              Sync $0
            </button>

            <button
              type="button"
              class="tool-btn"
              id="fit-graph"
              data-testid="fit-graph"
              title="Fit causal graph to viewport (0)"
            >
              Fit
            </button>

            <button
              type="button"
              class="tool-btn"
              id="theme-btn"
              data-testid="theme-btn"
              title="Cycle color theme (Auto / Dark / Light)"
            >
              Theme: Auto
            </button>
          </div>
        </div>

        <div class="toolbar-row toolbar-filters">
          <div
            class="pill-group"
            role="group"
            aria-label="Filter by node kind"
            id="kind-filter-group"
          >
            <button
              type="button"
              class="filter-pill"
              data-kind="all"
              data-testid="kind-filter-all"
              aria-pressed="true"
            >
              All
            </button>
            <button
              type="button"
              class="filter-pill"
              data-kind="model"
              data-testid="kind-filter-model"
              aria-pressed="false"
            >
              <span class="kind-dot kind-model" aria-hidden="true"></span>Models
            </button>
            <button
              type="button"
              class="filter-pill"
              data-kind="controller"
              data-testid="kind-filter-controller"
              aria-pressed="false"
            >
              <span class="kind-dot kind-controller" aria-hidden="true"></span
              >Ctrls
            </button>
            <button
              type="button"
              class="filter-pill"
              data-kind="context"
              data-testid="kind-filter-context"
              aria-pressed="false"
            >
              <span class="kind-dot kind-context" aria-hidden="true"></span
              >Context
            </button>
            <button
              type="button"
              class="filter-pill"
              data-kind="element"
              data-testid="kind-filter-element"
              aria-pressed="false"
            >
              <span class="kind-dot kind-element" aria-hidden="true"></span
              >Elements
            </button>
            <button
              type="button"
              class="filter-pill"
              data-kind="computed"
              data-testid="kind-filter-computed"
              aria-pressed="false"
            >
              <span class="kind-dot kind-computed" aria-hidden="true"></span
              >Computed
            </button>
            <button
              type="button"
              class="filter-pill"
              data-kind="observer"
              data-testid="kind-filter-observer"
              aria-pressed="false"
            >
              <span class="kind-dot kind-observer" aria-hidden="true"></span
              >Observer
            </button>
          </div>

          <span class="toolbar-sep" aria-hidden="true"></span>

          <div class="pill-group" role="group" aria-label="State filters">
            <button
              type="button"
              class="filter-pill"
              id="connected-only-btn"
              data-testid="connected-only-btn"
              aria-pressed="false"
              title="Show only connected nodes"
            >
              Connected
            </button>
            <button
              type="button"
              class="filter-pill"
              id="only-errors-btn"
              data-testid="only-errors-btn"
              aria-pressed="false"
              title="Show only nodes with errors or shouldUpdate vetoes"
            >
              Errors / Vetoes
            </button>
          </div>

          <div
            class="focus-breadcrumb"
            id="focus-breadcrumb"
            data-testid="focus-breadcrumb"
            hidden
          >
            <span
              class="focus-breadcrumb-text"
              id="focus-breadcrumb-label"
            ></span>
            <button
              type="button"
              class="focus-clear-btn"
              id="clear-focus-btn"
              data-testid="clear-focus-btn"
            >
              Show full graph
            </button>
          </div>

          <div
            class="stats-bar"
            id="stats-bar"
            data-testid="stats-bar"
            aria-live="off"
          >
            0 nodes · 0 edges
          </div>
        </div>
      </header>

      <main class="workspace">
        <section class="graph-pane" aria-label="Causal reactivity graph">
          <div class="graph-canvas" id="graph-canvas"></div>
          <div
            class="empty-state"
            id="empty-state"
            data-testid="empty-state"
            role="region"
            aria-label="Graph empty state"
          >
            <div class="empty-card">
              <svg
                class="empty-diagram"
                width="176"
                height="48"
                viewBox="0 0 176 48"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M40 24 H 66"
                  stroke="var(--border-strong)"
                  stroke-width="1.5"
                  stroke-dasharray="3 3"
                />
                <path
                  d="M110 24 H 136"
                  stroke="var(--border-strong)"
                  stroke-width="1.5"
                  stroke-dasharray="3 3"
                />
                <rect
                  x="4"
                  y="10"
                  width="36"
                  height="28"
                  rx="5"
                  fill="var(--bg-surface)"
                  stroke="var(--kind-model)"
                  stroke-width="1.5"
                />
                <text
                  x="22"
                  y="28"
                  text-anchor="middle"
                  fill="var(--kind-model)"
                  font-size="11"
                  font-family="var(--font-mono)"
                  font-weight="600"
                >
                  M
                </text>
                <rect
                  x="66"
                  y="10"
                  width="44"
                  height="28"
                  rx="6"
                  fill="var(--bg-surface)"
                  stroke="var(--kind-element)"
                  stroke-width="1.5"
                />
                <text
                  x="88"
                  y="28"
                  text-anchor="middle"
                  fill="var(--kind-element)"
                  font-size="11"
                  font-family="var(--font-mono)"
                  font-weight="600"
                >
                  &lt;el&gt;
                </text>
                <path
                  d="M142 10 H166 L172 16 V32 L166 38 H142 L136 32 V16 Z"
                  fill="var(--bg-surface)"
                  stroke="var(--kind-computed)"
                  stroke-width="1.5"
                />
                <text
                  x="154"
                  y="28"
                  text-anchor="middle"
                  fill="var(--kind-computed)"
                  font-size="11"
                  font-family="var(--font-mono)"
                  font-weight="600"
                >
                  f(x)
                </text>
              </svg>
              <h2 class="empty-title" id="empty-state-title">
                Waiting for Lit reactivity
              </h2>
              <p class="empty-desc" id="empty-state-desc">
                Interact with the page or trigger a DOM scan to trace models,
                controllers,
                <code>@lit/context</code> streams, custom elements, and
                <code>memoize-one</code> computations.
              </p>
              <div class="empty-actions" id="empty-state-actions">
                <button type="button" class="primary-btn" id="empty-scan-btn">
                  Scan DOM
                </button>
                <button
                  type="button"
                  class="tool-btn"
                  id="empty-reset-btn"
                  hidden
                >
                  Reset filters
                </button>
              </div>
            </div>
          </div>
          <div
            class="graph-hud"
            id="graph-hud"
            aria-label="Graph zoom controls"
          >
            <button
              type="button"
              class="hud-btn"
              id="zoom-out-btn"
              title="Zoom out (−)"
              aria-label="Zoom out"
            >
              −
            </button>
            <span class="hud-zoom" id="zoom-readout">100%</span>
            <button
              type="button"
              class="hud-btn"
              id="zoom-in-btn"
              title="Zoom in (+)"
              aria-label="Zoom in"
            >
              +
            </button>
            <button
              type="button"
              class="hud-btn"
              id="hud-fit-btn"
              title="Fit graph (0)"
              aria-label="Fit graph"
            >
              Fit
            </button>
          </div>
          <div
            class="toast-banner"
            id="toast-banner"
            role="status"
            aria-live="polite"
            hidden
          ></div>
        </section>

        <div class="drawer-tabs" role="tablist" aria-label="Detail panes">
          <button
            type="button"
            class="drawer-tab"
            role="tab"
            id="tab-inspector"
            data-testid="tab-inspector"
            data-tab="inspector"
            aria-selected="true"
            aria-controls="inspector-view"
          >
            Inspector
          </button>
          <button
            type="button"
            class="drawer-tab"
            role="tab"
            id="tab-waterfall"
            data-testid="tab-waterfall"
            data-tab="waterfall"
            aria-selected="false"
            aria-controls="waterfall-view"
          >
            Waterfall
            <span class="tab-count" id="tab-waterfall-count">0</span>
          </button>
        </div>

        <aside
          class="inspector-pane"
          id="inspector-view"
          data-testid="inspector-view"
          aria-label="Node Inspector"
        ></aside>

        <section
          class="waterfall-pane"
          id="waterfall-view"
          data-testid="waterfall-view"
          aria-label="Waterfall and Trace Timeline"
        ></section>
      </main>
    </div>

    <script type="module" src="panel.js"></script>
  </body>
</html>
